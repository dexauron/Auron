# Быстрая проверка каталога на pull request. Ничего не публикует — только
# смотрит, что код цел и соблюдает правила проекта. Публикацией занимается
# deploy.yml, и он на pull request не запускается.
name: Проверка каталога (PR)

on:
  pull_request:
    branches:
      - claude/store-product-catalog-60wer4
    paths:
      - 'catalog/**'
      - '.github/workflows/catalog-pr.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Синтаксис модулей и офлайн-копии
        run: |
          for f in catalog/js/modules/*.js catalog/sw.js catalog/js/config.js; do
            node --check "$f"
          done

      - name: Правила модулей (размер, импорты, офлайн-кэш, лишние экспорты)
        run: node catalog/tests/modules.js

      - name: Без эмодзи в интерфейсе
        run: node catalog/tests/no-emoji.js
