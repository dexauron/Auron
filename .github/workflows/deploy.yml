name: Deploy to GitHub Pages

# ВАЖНО. Сайт собирается из ТРЁХ независимых источников:
#   приложение Auron   — ветка claude/optimistic-einstein-Afzmv (папка app/)
#   каталог товаров    — ветка claude/store-product-catalog-60wer4 (папка catalog/)
#   страница сканера   — ветка claude/cool-archimedes-qv458l (app/scan.html)
#
# Публикация идёт с force_orphan, то есть ЗАМЕНЯЕТ содержимое сайта целиком.
# Поэтому каждая сборка обязана собрать все три части. Если workflow собирает
# только свою часть — остальные пропадают с сайта (так каталог однажды уже
# «превратился» в 404).
#
# ⚠️ ЭТОТ ФАЙЛ ДОЛЖЕН БЫТЬ ОДИНАКОВЫМ ВО ВСЕХ ВЕТКАХ ИЗ СПИСКА on.push.branches.
# GitHub запускает workflow из той ветки, в которую пушнули, — своя копия есть
# у каждой. Меняешь этот файл — синхронизируй во все перечисленные ветки.

on:
  push:
    branches:
      - main
      - master
      - claude/optimistic-einstein-Afzmv
      - claude/store-product-catalog-60wer4
      - claude/cool-archimedes-qv458l
  workflow_dispatch:

permissions:
  contents: write

# Одновременно идёт только ОДНА сборка, устаревшие отменяются.
# Очередь тут вредна: каждая публикация пишет в gh-pages, а каждая запись
# запускает сборку GitHub Pages. При частых пушах (публикация витрины из
# приложения + правки кода) очередь разрасталась, и публикации Pages начинали
# падать по таймауту «deployment_queued» — сайт оставался на старой версии.
# Сборка публикует ВСЁ текущее состояние веток, поэтому терять промежуточные
# запуски не жалко: важен только последний.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Основа сайта — приложение Auron
        uses: actions/checkout@v4
        with:
          ref: claude/optimistic-einstein-Afzmv

      - name: Исходники каталога
        uses: actions/checkout@v4
        with:
          ref: claude/store-product-catalog-60wer4
          path: catalog-src

      - name: Исходники страницы сканера
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: claude/cool-archimedes-qv458l
          path: scan-src

      - name: Добавить каталог
        run: |
          rm -rf app/catalog
          mkdir -p app/catalog
          cp -r catalog-src/catalog/. app/catalog/
          rm -rf app/catalog/setup
          rm -rf app/catalog/tests    # проверки — для разработки, на сайте не нужны
          # Зашифрованные каталоги владельца и сотрудника приложение читает
          # НАПРЯМУЮ из репозитория (raw.githubusercontent.com), а не с сайта.
          # На сайте они не нужны, а весят ~29 МБ из 35 — из-за них публикация
          # Pages тянулась долго и срывалась по таймауту.
          rm -f app/catalog/data/*.enc
          rm -rf catalog-src
          echo "размер сайта: $(du -sh app | cut -f1)"

      - name: Добавить страницу сканера
        run: |
          if [ -f scan-src/app/scan.html ]; then
            cp scan-src/app/scan.html app/scan.html
            echo "scan.html добавлен"
          else
            echo "::warning::scan-src/app/scan.html не найден — сканер не публикуется"
          fi
          rm -rf scan-src

      # Страховка от «сайта без половины частей»: лучше не выложить ничего,
      # чем выложить сайт, где у людей внезапно 404.
      - name: Проверить, что собрались все части
        run: |
          missing=""
          [ -f app/index.html ] || missing="$missing app/index.html"
          [ -f app/catalog/index.html ] || missing="$missing app/catalog/index.html"
          if [ -n "$missing" ]; then
            echo "::error::не собрано:$missing — публикация отменена"
            exit 1
          fi
          echo "все части на месте: приложение + каталог$( [ -f app/scan.html ] && echo ' + сканер' )"

      - name: Опубликовать на GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app
          force_orphan: true
