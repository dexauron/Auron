name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/optimistic-einstein-Afzmv, claude/store-product-catalog-60wer4]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add catalog app
        run: |
          mkdir -p app/catalog
          cp -r catalog/. app/catalog/
          rm -rf app/catalog/setup

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app
          force_orphan: true
