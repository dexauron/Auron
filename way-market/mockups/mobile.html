function buyerHomeV2(){let count=Object.values(list).reduce((a,b)=>a+b,0);return `<h1 class="home-title">Покупки проще</h1><p class="home-sub">Товары магазина — под рукой. Составьте список или отправьте его сотруднику.</p><div class="home-hero"><div><span class="kicker">Ваш список</span><strong>${count?count+' '+(count%10===1&&count%100!==11?'товар':count%10>=2&&count%10<=4&&(count%100<12||count%100>14)?'товара':'товаров'):'Пока пусто'}</strong></div>${btn('Открыть список','buyerList')}</div><div class="home-actions">${actionRow('⌕','Найти товар','По названию и категории','buyerCatalog')}${actionRow('▦','Категории','Перейти к нужному отделу','buyerCategories')}${actionRow('↗','Отправить в WhatsApp','Обсудить наличие и получение','buyerShare')}${actionRow('✧','Помощник','По товарам и вашему списку','aiAssistant')}</div>${disclosure('Часто покупают',goods.slice(0,3).map(g=>goodRow(g)).join('')+btn('Весь каталог','buyerCatalog'),false,'Показать')}${disclosure('Ещё для покупок',`<div class="home-actions">${actionRow('♡','Избранное','Быстрый доступ к сохранённому','buyerSaved')}${actionRow('✧','Новинки','Опубликованные магазином товары','buyerUpdates')}${actionRow('?','Помощь','Как пользоваться списком','buyerHelp')}</div>`,false,'3 раздела')}<p class="quiet-note">Демонстрационные товары и цены. Итог и наличие подтвердит сотрудник.</p>`}

case'buyerSaved':return intro('Избранное','Сохранённые товары для быстрого возвращения.')+`<div class="grid">${card('Ваши товары',`<div class="empty"><b>Здесь появится избранное</b>Отметьте понравившиеся товары в рабочей версии каталога.</div>`,12)}</div>`;

// Изолированный демонстрационный расчёт. Пустое/некорректное число не равно нулю.
const cashDemo={date:'2026-10-14',shift:'1',cashier:'Кассир 1',zCash:'30000',zCard:'40000',zSbp:'20000',opening:'2500',otherIn:'0',retained:'0',claimed:'24900',accepted:'24800',payments:[{name:'Накладная № 448',amount:'7500',confirmed:true}]};
const escaped=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rubKopecks(v){let s=String(v).replace(/[\s\u00a0\u202f]/g,'');if(!/^\d+(?:[.,]\d{1,2})?$/.test(s))return null;let [a,b='']=s.replace(',','.').split('.');let n=Number(a)*100+Number((b+'00').slice(0,2));return Number.isSafeInteger(n)?n:null}
function signedMoney(k){return k===null?'Нет данных':(k>0?'+':k<0?'−':'')+fmt(Math.abs(k)/100)}
function cashFigures(){let names=['zCash','opening','otherIn','retained','claimed','accepted'],v={};for(let name of names){v[name]=rubKopecks(cashDemo[name]);if(v[name]===null)return null}let payout=0;for(let p of cashDemo.payments.filter(p=>p.confirmed)){let n=rubKopecks(p.amount);if(n===null)return null;payout+=n;if(!Number.isSafeInteger(payout))return null}let expected=v.opening+v.zCash+v.otherIn-payout-v.retained;let declaredDiff=v.claimed-expected,handedDiff=v.accepted-v.claimed,actualDiff=v.accepted-expected;if(![expected,declaredDiff,handedDiff,actualDiff].every(Number.isSafeInteger)||expected<0)return null;return {expected,payout,declaredDiff,handedDiff,actualDiff}}
function moneyInput(label,key){return `<div class="control"><label>${label}<input class="field" data-cash-field="${key}" inputmode="decimal" value="${escaped(cashDemo[key])}" aria-label="${label}"></label></div>`}
function payoutRows(){return cashDemo.payments.map((p,i)=>`<div class="item"><div class="item-main"><div class="control"><label>Основание выплаты<input class="field" data-payout-name="${i}" value="${escaped(p.name)}" placeholder="Например, накладная №…"></label></div><div class="control" style="margin-top:9px"><label>Сумма из кассы, ₽<input class="field" data-payout-amount="${i}" inputmode="decimal" value="${escaped(p.amount)}" aria-label="Сумма выплаты ${i+1}"></label></div><label class="label" style="display:block;margin-top:9px"><input type="checkbox" data-payout-confirmed="${i}" ${p.confirmed?'checked':''}> Деньги выданы из этой кассы</label></div><button class="btn danger" data-payout-remove="${i}" aria-label="Убрать выплату ${i+1}">×</button></div>`).join('')||'<div class="empty"><b>Выплат не было</b>Если деньги не выдавали, оставьте список пустым.</div>'}
function cashResults(){let v=cashFigures();if(!v)return '<div class="banner error">Проверьте суммы: пустое поле, некорректное число или выплата больше наличных.</div>';return `${pair('Отмечено как выданное из кассы','−'+fmt(v.payout/100))}${pair('Кассир заявил − ожидается',signedMoney(v.declaredDiff))}${pair('Принято − заявлено',signedMoney(v.handedDiff))}${pair('Принято − ожидается',signedMoney(v.actualDiff))}<p class="meta">Минус означает недостачу, плюс — излишек.</p>`}
function shiftWorkspace(){let v=cashFigures();return `<h1 class="home-title">Закрытие смены</h1><p class="home-sub">Сначала отчёт и выплаты. Затем сумма, которую бухгалтер получил и пересчитал.</p><div class="home-hero"><div><span class="kicker">Ожидается к передаче · пример</span><strong id="cashExpectedInline">${v?fmt(v.expected/100):'Нет данных'}</strong></div>${btn('Проверить расхождения','reconcile')}</div>${disclosure('1. Данные Z‑отчёта',`<div class="form-grid"><div class="control"><label>Дата смены<input class="field" type="date" data-cash-field="date" value="${cashDemo.date}"></label></div><div class="control"><label>Номер смены<input class="field" data-cash-field="shift" value="${escaped(cashDemo.shift)}"></label></div><div class="control wide"><label>Кассир<input class="field" data-cash-field="cashier" value="${escaped(cashDemo.cashier)}"></label></div>${moneyInput('Наличные по Z‑отчёту, ₽','zCash')}${moneyInput('Карта по Z‑отчёту, ₽','zCard')}${moneyInput('СБП по Z‑отчёту, ₽','zSbp')}</div><p class="meta">Карта и СБП хранятся отдельно от переданных наличных.</p>`,true)}${disclosure('2. Выплаты из кассы',`${payoutRows()}<div class="form-actions"><button class="btn" data-payout-add="1">+ Добавить выплату</button></div><p class="meta">В расчёт входят только суммы, которые действительно выдали из кассы. Документ и проведение платежа бухгалтер проверяет отдельно. Если выплат не было, оставьте список пустым.</p>`,false,`<span id="payoutTotalInline">${v?fmt(v.payout/100):'Проверить'}</span>`).replace('<details class="disclosure"','<details class="disclosure" data-step="payout"')}${disclosure('3. Передача бухгалтеру',`<div class="form-grid">${moneyInput('Наличные на начало смены, ₽','opening')}${moneyInput('Другой подтверждённый приход, ₽','otherIn')}${moneyInput('Размен оставили в кассе, ₽','retained')}${moneyInput('Кассир заявил, что передал, ₽','claimed')}${moneyInput('Бухгалтер принял и пересчитал, ₽','accepted')}</div>`,false)}${disclosure('Подробный расчёт',`<div id="cashResults">${cashResults()}</div><div class="form-actions">${btn('Отдельный экран сверки','reconcile')}</div>`,false)}<div class="form-actions"><button class="btn primary" data-demo="Черновик смены">Сохранить черновик</button></div><p class="quiet-note">Демонстрация: значения живут только в открытом макете и не проводятся в учёте.</p>`}
function reconcileWorkspace(){let v=cashFigures(),moneyOf=s=>{let n=rubKopecks(s);return n===null?'Нет данных':fmt(n/100)};return `<h1 class="home-title">Сверка кассы</h1><p class="home-sub">Итог после независимого пересчёта бухгалтером.</p><div class="home-hero ${v&&v.actualDiff<0?'danger':''}"><div><span class="kicker">${v?v.actualDiff<0?'Недостача':v.actualDiff>0?'Излишек':'Без расхождения':'Нужны данные'}</span><strong id="cashExpectedInline">${v?signedMoney(v.actualDiff):'Нет данных'}</strong><span class="kicker">Принято − расчётно к передаче</span></div>${btn('Изменить суммы','shift')}</div><div class="card">${pair('Расчётно к передаче',v?fmt(v.expected/100):'Нет данных')}${pair('Кассир заявил',moneyOf(cashDemo.claimed))}${pair('Бухгалтер пересчитал',moneyOf(cashDemo.accepted))}</div>${disclosure('Откуда получилась разница',`<div id="cashResults">${cashResults()}</div><p class="meta">Каждое значение можно проследить до Z‑отчёта, выплат и передачи.</p>${btn('Показать исходные поля','shift')}`,false)}${disclosure('Карта и СБП',`${pair('Карта по Z‑отчёту',moneyOf(cashDemo.zCard))}${pair('СБП по Z‑отчёту',moneyOf(cashDemo.zSbp))}<p class="meta">Сверка с эквайрингом/банком проводится отдельно. Эти суммы не включены в наличные, переданные бухгалтеру.</p>`,false)}${disclosure('Правило расчёта',`${pair('Начало + наличная выручка + прочий приход','')}${pair('Минус выплаты и оставленный размен','')}${btn('Настроить формулу','formula')}`,false)}<p class="quiet-note">Все числа вымышленные и не сохраняются.</p>`}

default:return ''}}
// Предметные карточки экранов для обсуждения: поля и состояние зависят от сценария.
function workflowScreen(s){let fields=s.fields.map(f=>pair(f,'Нет данных · макет')).join('');let steps=s.fields.map((f,i)=>`<div class="step"><span class="step-index">${i+1}</span>${f}</div>`).join('');let body=s.view==='list'?`${card('Разделы и записи',s.fields.map((f,i)=>listRow('›',f,'Открыть связанный процесс','',s.targets?.[i]||s.related)).join(''),8)}${card('Проверка',`<p class="hint">${s.guard}</p>`,4)}`:s.view==='form'?`${card('Поля и ввод',s.fields.map(f=>control(f,'Укажите по источнику')).join('')+`<div class="form-actions">${btn('Перейти к проверке',s.related,'primary')}</div>`,8)}${card('Перед действием',`<p class="hint">${s.guard}</p>`,4)}`:s.view==='compare'?`${card('Сопоставление',fields,8)}${card('Разница',`<div class="empty"><b>Нет данных</b>Значения сравниваются только после проверки источников.</div><p class="hint">${s.guard}</p>`,4)}`:s.view==='timeline'?`${card('Последовательность',steps,8)}${card('Текущее состояние',`<div class="empty"><b>Не загружено</b>История будет показана после подключения данных.</div><p class="hint">${s.guard}</p>`,4)}`:`${note(s.guard,'warning')}${card('Что проверить',fields,8)}${card('Действие',btn('Открыть связанный раздел',s.related,'primary'),4)}`;return intro(s.title,s.summary,btn('К разделу',s.related))+`<div class="grid">${body}</div><p class="meta">Сценарий для роли · прототип без сохранения данных</p>`}
function extendedScreen(){let s=S.find(x=>x.id===screen);if(!s||!s.kind)return '';if(s.kind==='workflow')return workflowScreen(s);
 let status=tag(s.status,s.status==='Доступно'?'good':'warn');
 let rows=s.fields.map(f=>pair(f,'— · пример или нет данных')).join('');
 let content=s.kind==='scenario'?`${card('Что здесь нужно сделать',`<p class="hint">${s.summary}</p>${s.fields.map((f,i)=>pair(f,i===0?'Выберите или проверьте':'Не указано · макет')).join('')}`,8)}${card('Состояния',s.states.map(x=>`<div class="step"><span class="step-index">•</span>${x}</div>`).join(''),4)}${card('Следующий шаг',`<p class="hint">${s.guard}</p>${btn('Перейти к связанному разделу',s.related)}`,12)}`:
 s.kind==='kpi'?`${note('Для расчёта нужны: '+s.needed+'. Если выгрузка неполна, выводится «Нет данных», а не ноль.','warning')}${card('Паспорт показателя',`${pair('Что требуется',s.needed)}${pair('Период','Один период для числителя и знаменателя')}${pair('Состояние','Методика к реализации')}`,8)}${card('Проверить доступность',`${btn('Недостающие данные','readiness')}<p class="hint">Точная формула и учётная политика утверждаются в ТЗ до подключения данных.</p>`,4)}`:
 s.kind==='task'?`${card('Данные для действия',s.fields.map(f=>control(f,'Введите или выберите…')).join('')+`<div class="form-actions"><button class="btn primary" type="button" data-demo="Черновик: сохранение не подключено">Продолжить</button></div>`,8)}${card('Порядок',`<p class="hint">${s.summary}</p>${pair('Статус',status)}`,4)}`:
 s.kind==='history'?`${card('История',table(['Поле','Значение'],s.fields.map(f=>[f,'Нет данных · макет'])),12)}`:
 s.kind==='exception'?`${note(s.summary,'warning')}${card('Проверить причину',rows,8)}${card('Следующий шаг',btn('Вернуться',s.related),4)}`:
 s.kind==='review'?`${card('Проверка перед решением',rows,8)}${card('Следующий шаг',`<p class="hint">Подтверждение требует прав и журнала событий. Здесь действие не выполняется.</p>${btn('Исходный раздел',s.related)}`,4)}`:
 `${card('Сведения',rows,8)}${card('Связанный раздел',`<p class="hint">${s.summary}</p>${btn('Открыть',s.related)}`,4)}`;
 return intro(s.title,s.summary,btn('К разделу',s.related))+(selectedRow?.target===screen?note('Выбрана запись: '+selectedRow.values.map(escaped).join(' · ')):'')+`<div class="grid">${content}</div><p class="meta">Экран сценария · ${s.kind==='kpi'?'аналитика':s.kind} · прототип без сохранения данных</p>`}
function permitted(){return S.filter(s=>s.roles.includes(role))}
function selectRole(next){selectedRow=null;role=next;$('role').value=role;$('mobileRole').value=role;screen=({buyer:'buyerHome',employee:'staffCatalog',admin:'staffCatalog',rep:'repHome',accountant:'overview',owner:'overview'})[role];category='Все';location.hash=role+'/'+screen;$('drawer').hidden=true;render()}
function go(id){let s=S.find(x=>x.id===id);if(!s||!s.roles.includes(role))return;screen=id;location.hash=role+'/'+screen+(screen==='buyerProduct'?'/'+selectedProduct:'');render();window.scrollTo(0,0);$('drawer').hidden=true}
function navigation(){let grouped={};for(let s of permitted())(grouped[s.group]??=[]).push(s);const link=s=>`<button type="button" class="side-link ${s.id===screen?'active':''}" data-go="${s.id}" ${s.id===screen?'aria-current="page"':''}><span class="icon">${uiIcon(s.id)}</span>${s.title}</button>`;$('side').innerHTML=Object.entries(grouped).map(([g,items])=>`<div class="group-label">${g}</div>${items.map(link).join('')}`).join('');$('drawerNav').innerHTML=`<div class="control" style="padding:0 8px 11px"><label>Найти экран<input type="search" class="search" data-nav-search="1" placeholder="Например, выплаты" aria-label="Найти экран" style="width:100%"></label></div>`+Object.entries(grouped).map(([g,items])=>`<details class="nav-section" ${items.some(x=>x.id===screen)?'open':''}><summary>${g}<span class="nav-count">${items.length}</span></summary>${items.map(link).join('')}</details>`).join('');let tabs=role==='buyer'?['buyerHome','buyerCatalog','buyerList','buyerSaved']:role==='rep'?['repHome','repDocs','repPayments','repIssue']:(role==='employee'||role==='admin')?['staffCatalog','orders','invoices','limitView']:['overview','shift','reconcile','cash'];let label={buyerHome:'Главная',buyerCatalog:'Каталог',buyerList:'Список',buyerSaved:'Избранное',staffCatalog:'Каталог',orders:'Заказы',invoices:'Документы',limitView:'Лимит',repHome:'Главная',repDocs:'Документы',repPayments:'Выплаты',repIssue:'Сверка',overview:'Сегодня',shift:'Смена',reconcile:'Сверка',cash:'Счета'};$('mobileNav').innerHTML=tabs.map(id=>`<button type="button" data-go="${id}" class="${screen===id?'active':''}" ${screen===id?'aria-current="page"':''}><span class="nav-ic">${uiIcon(id)}</span>${label[id]}</button>`).join('')+'<button type="button" data-menu="1"><span class="nav-ic">${uiIcon("menu")}</span>Ещё</button>'}
function render(){let s=S.find(x=>x.id===screen);if(!s||!s.roles.includes(role)){screen=permitted()[0].id;s=S.find(x=>x.id===screen)}navigation();$('crumb').textContent='WAY MARKET';$('content').innerHTML=(s.id==='aiAssistant'?assistantScreen():role==='buyer'?buyer():role==='rep'?rep():role==='admin'||s.group==='Магазин'?employee():finance());$('role').value=role;$('mobileRole').value=role;document.title=s.title+' — Way Market · макет'}
let timer;function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,3000)}
document.addEventListener('keydown',e=>{const row=e.target.closest?.('tr[data-go]');if(row&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectedRow=row.dataset.row?{target:row.dataset.go,source:row.dataset.source,values:JSON.parse(decodeURIComponent(row.dataset.row))}:null;go(row.dataset.go)}});
document.addEventListener('click',e=>{let b=e.target.closest('[data-go],[data-category],[data-add],[data-clear],[data-demo],[data-menu],[data-payout-add],[data-payout-remove],[data-fulfillment],[data-qty-minus],[data-qty-plus],[data-product],[data-open-category],[data-switch-role]');if(!b)return;if(b.dataset.go){const row=b.dataset.row?b:b.closest?.('[data-row]');selectedRow=row?.dataset.row?{target:b.dataset.go,source:row.dataset.source,values:JSON.parse(decodeURIComponent(row.dataset.row))}:null;go(b.dataset.go)}else if(b.dataset.switchRole){selectRole(b.dataset.switchRole)}else if(b.dataset.product){if(!goods.some(x=>x[0]===b.dataset.product))return;selectedProduct=b.dataset.product;go('buyerProduct')}else if(b.dataset.openCategory){category=b.dataset.openCategory;go('buyerCatalog')}else if(b.dataset.fulfillment){fulfillment=b.dataset.fulfillment;render()}else if(b.dataset.category){category=b.dataset.category;render()}else if(b.dataset.add){let id=b.dataset.add;if(!goods.some(x=>x[0]===id))return;if((list[id]||0)>=99){toast('Не больше 99 штук одного товара');return}list[id]=(list[id]||0)+1;toast('Добавлено в список · демонстрация')}else if(b.dataset.qtyPlus){let id=b.dataset.qtyPlus;if(!goods.some(x=>x[0]===id))return;if((list[id]||0)>=99){toast('Не больше 99 штук одного товара');return}list[id]=(list[id]||0)+1;render()}else if(b.dataset.qtyMinus){let id=b.dataset.qtyMinus;if(!goods.some(x=>x[0]===id))return;let n=(list[id]||0)-1;if(n>0)list[id]=n;else delete list[id];render()}else if(b.dataset.clear){list={};render();toast('Список очищен')}else if(b.dataset.payoutAdd){cashDemo.payments.push({name:'',amount:'',confirmed:false});render();document.querySelector('[data-step=payout]')?.setAttribute('open','')}else if(b.dataset.payoutRemove!==undefined){cashDemo.payments.splice(Number(b.dataset.payoutRemove),1);render();document.querySelector('[data-step=payout]')?.setAttribute('open','')}else if(b.dataset.demo){toast(b.dataset.demo+' · действие показано только в макете')}else if(b.dataset.menu){$('drawer').hidden=false}});
function refreshCash(){let box=$('cashResults'),v=cashFigures();if(box)box.innerHTML=cashResults();let expected=$('cashExpectedInline');if(expected&&screen==='shift')expected.textContent=v?fmt(v.expected/100):'Нет данных';let payout=$('payoutTotalInline');if(payout)payout.textContent=v?fmt(v.payout/100):'Проверить'}
document.addEventListener('input',e=>{if(e.target.id==='productSearch'){let q=e.target.value.trim().toLocaleLowerCase('ru');let rows=[...document.querySelectorAll('#goodRows .item')];for(let row of rows)row.hidden=!row.dataset.name.includes(q);let empty=$('goodsEmpty');if(empty)empty.hidden=rows.some(row=>!row.hidden)}if(e.target.dataset.navSearch!==undefined){let q=e.target.value.trim().toLocaleLowerCase('ru');for(let group of document.querySelectorAll('.nav-section')){let any=false;for(let link of group.querySelectorAll('.side-link')){link.hidden=!link.textContent.toLocaleLowerCase('ru').includes(q);if(!link.hidden)any=true}group.hidden=!any;if(q&&any)group.open=true}}if(e.target.dataset.cashField){cashDemo[e.target.dataset.cashField]=e.target.value;refreshCash()}if(e.target.dataset.payoutAmount!==undefined){cashDemo.payments[Number(e.target.dataset.payoutAmount)].amount=e.target.value;refreshCash()}if(e.target.dataset.payoutName!==undefined){cashDemo.payments[Number(e.target.dataset.payoutName)].name=e.target.value}});
document.addEventListener('change',e=>{if(e.target.dataset.payoutConfirmed!==undefined){cashDemo.payments[Number(e.target.dataset.payoutConfirmed)].confirmed=e.target.checked;refreshCash()}});
$('role').addEventListener('change',e=>selectRole(e.target.value));$('mobileRole').addEventListener('change',e=>selectRole(e.target.value));$('theme').addEventListener('click',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'});$('device').addEventListener('click',()=>document.body.classList.toggle('preview-mobile'));$('menu').addEventListener('click',()=>$('drawer').hidden=false);$('closeDrawer').addEventListener('click',()=>$('drawer').hidden=true);$('drawer').addEventListener('click',e=>{if(e.target===$('drawer'))$('drawer').hidden=true});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('drawer').hidden=true});
function readRoute(){let parts=location.hash.replace(/^#/,'').split('/');if(!['buyer','employee','rep','accountant','owner'].includes(parts[0]))return false;let target=S.find(x=>x.id===parts[1]&&x.roles.includes(parts[0]));role=parts[0];if(!target){screen='accessDenied';return true}screen=target.id;if(screen==='buyerProduct'&&goods.some(g=>g[0]===parts[2]))selectedProduct=parts[2];return true}
if(!readRoute()){role='buyer';screen='buyerHome'}render();
window.addEventListener?.('hashchange',()=>{if(readRoute()){render();window.scrollTo(0,0);$('drawer').hidden=true}});

</script>
