const tag=(s,t='')=>`<span class="tag ${t}">${s}</span>`;
const listRow=(icon,title,note,right='',target='')=>`<div class="item"><div class="avatar" aria-hidden="true">${icon}</div><div class="item-main"><div class="item-title">${title}</div><div class="item-note">${note}</div></div><div class="item-side">${right}${target?`<div style="margin-top:7px">${btn('Открыть',target)}</div>`:''}</div></div>`;
const pair=(a,b)=>`<div class="info-pair"><span>${a}</span><strong>${b}</strong></div>`;
const table=(heads,rows)=>`<div class="table-wrap"><table class="table"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const control=(label,placeholder,type='text',value='')=>`<div class="control"><label>${label}<input class="field" type="${type}" placeholder="${placeholder}" value="${value}"></label></div>`;
const form=(fields,actions='Сохранить черновик')=>`<div class="form-grid">${fields.join('')}</div><div class="form-actions"><button class="btn primary" type="button" data-demo="${actions}">${actions}</button><button class="btn" type="button" data-demo="Проверка данных">Проверить данные</button></div>`;
const note=(t,type='')=>`<div class="banner ${type}">${t}</div>`;
const spark=()=>`<div class="spark" aria-label="Иллюстративный график">${[38,49,44,57,53,72,65,81,76,67,93,84].map(n=>`<span style="height:${n}%"></span>`).join('')}</div>`;
function buyerGoods(){let filtered=goods.filter(g=>category==='Все'||g[2]===category);return `<div class="pills">${['Все','Молочные','Хлеб','Овощи и фрукты','Бакалея','Напитки'].map(c=>`<button type="button" class="pill ${category===c?'active':''}" data-category="${c}">${c}</button>`).join('')}</div><div class="grid">${card('Найти товар',`<input class="search" id="productSearch" type="search" placeholder="Название товара…" aria-label="Найти товар" style="width:100%"><div class="meta">Каталог демонстрационный · дата обновления не определена</div>`,12)}<div class="span-12 card"><div class="list" id="goodRows">${filtered.map(g=>goodRow(g)).join('')}</div></div></div>`}
function goodRow(g){return `<div class="item" data-name="${g[1].toLowerCase()}"><div class="avatar">${g[4]}</div><div class="item-main"><div class="item-title">${g[1]}</div><div class="item-note">${g[2]} · Наличие: ${g[5]} · пример</div></div><div class="item-side">${fmt(g[3])}<div style="margin-top:7px"><button class="btn" type="button" data-add="${g[0]}">+ В список</button></div></div></div>`}

case'buyerList':{let rows=Object.entries(list).map(([id,q])=>{let g=goods.find(x=>x[0]===id);return g?listRow(g[4],g[1],`${q} шт. · ориентировочно`,fmt(g[3]*q)):''}).join('');let total=Object.entries(list).reduce((a,[id,q])=>a+(goods.find(x=>x[0]===id)?.[3]||0)*q,0);return intro('Мой список','Можно открыть его в магазине или подготовить сообщение сотруднику.',btn('Добавить товары','buyerCatalog'))+`<div class="grid">${card('Товары',rows||'<div class="empty"><b>Список пуст</b>Добавьте товары из каталога.</div>',7)}${card('Ориентировочная сумма',`<div class="metric">${fmt(total)}</div><p class="hint">Цена и наличие требуют подтверждения.</p>${btn('Подготовить WhatsApp','buyerShare','primary')}<div class="safe-space"></div><button class="btn danger" data-clear="1">Очистить список</button>`,5)}</div>`}
case'buyerShare':return intro('Подготовка сообщения','Заявка уходит только после вашего действия в WhatsApp.',btn('Вернуться к списку','buyerList'))+`<div class="grid">${card('Способ получения',`<div class="pills"><button class="pill active" data-demo="Самовывоз">Самовывоз</button><button class="pill" data-demo="Доставка">Доставка</button></div><p class="hint">Детали получения обсудит сотрудник в переписке.</p>${btn('Посмотреть список','buyerList')}`,6)}${card('Предпросмотр сообщения',`<div class="callout"><strong>Здравствуйте! Хочу заказать:</strong><br>${Object.entries(list).map(([id,q])=>goods.find(g=>g[0]===id)?.[1]+' — '+q+' шт.').join('<br>')||'Товары пока не выбраны'}<br><br>Подтвердите наличие и итоговую стоимость.</div><div class="form-actions"><button class="btn primary" data-demo="Макет: отправка отключена">Перейти в WhatsApp</button></div>`,6)}</div>`;
case'buyerSaved':return intro('Избранное','Сохранённые товары для быстрого возвращения.')+`<div class="grid">${card('Ваши товары',`<div class="empty"><b>Здесь появится избранное</b>Отметьте понравившиеся товары в рабочей версии каталога.</div>`,12)}</div>`;
case'buyerUpdates':return intro('Новинки и предложения','Показываются только данные, опубликованные магазином.')+`<div class="grid">${card('Свежие поступления',listRow('🍎','Яблоки 1 кг','Пример публикации · дата появления не указана',fmt(159),'buyerProduct'),8)}${card('Актуальность',`<p class="hint">Если дата обновления неизвестна, показываем это прямо. Персональные сведения и внутренние продажи сюда не попадают.</p>`,4)}</div>`;
case'buyerHelp':return intro('Как пользоваться','Простой путь от выбора товара до разговора с магазином.')+`<div class="grid">${card('Покупка в магазине',`<div class="step"><span class="step-index">1</span> Найдите товары в каталоге.</div><div class="step"><span class="step-index">2</span> Добавьте их в список.</div><div class="step"><span class="step-index">3</span> Откройте список у полки.</div>`,6)}${card('Заявка в WhatsApp',`<div class="step"><span class="step-index">1</span> Соберите список.</div><div class="step"><span class="step-index">2</span> Выберите самовывоз или доставку.</div><div class="step"><span class="step-index">3</span> Отправьте сообщение и согласуйте детали.</div>`,6)}</div>`;

case'importReview':return intro('Проверка импорта','Пример предпросмотра до записи в базу.',btn('Вернуться к загрузке','import'))+note('Файл продаж октября неполный на дату примера. Строки с отсутствующей себестоимостью идут на проверку.','warning')+`<div class="grid">${metric('Новые','124','Только после подтверждения',3)}${metric('Изменённые','3','Показать разницу',3)}${metric('Повторы','1','Не проводить повторно',3)}${metric('Ошибки','13','Не использовать в точной прибыли',3)}${card('Проверка записей',table(['Строка','Товар / документ','Источник','Проблема'],[['18','Товар 001','Продажи.xls',tag('Нет себестоимости','bad')],['29','Товар 002','Продажи.xls',tag('Нет суммы продажи','bad')],['44','Документ 448','Приходные.xlsx',tag('Похожий документ','warn')]]),12)}</div>`;
case'suppliers':return intro('Поставщики','Связь с 1С строится по устойчивому коду и подтверждённым соответствиям.')+`<div class="grid">${card('Справочник',table(['Поставщик','Код источника','Документы','Сверка'],[['Молочный двор','SUP-001','14',tag('Сопоставлено','good')],['Юг Фуд','SUP-002','9',tag('Сопоставлено','good')],['Неизвестный контрагент','—','1',tag('Требует выбора','warn')]]),12)}</div>`;
case'roles':return intro('Доступ сотрудников','Назначение прав — отдельное действие владельца. Этот экран не даёт реального доступа.',btn('Добавить приглашение','roles','primary'))+`<div class="grid">${card('Участники',table(['Сотрудник','Роль','Область','Статус'],[['А. Исаев','Администратор','Магазин',tag('Активен','good')],['М. Алиева','Бухгалтер','Финансы',tag('Активен','good')],['Т. Хаджиев','Сотрудник','Каталог и заказы',tag('Активен','good')]]),12)}${card('Права',`<p class="hint">Матрица утверждается отдельно. Роль и магазин проверяются в каждой операции, а не только в интерфейсе. В локальном режиме на одном ПК разделение доступа требует отдельной защиты хранилища.</p>`,12)}</div>`;
case'audit':return intro('Журнал изменений','Автор, время и прежнее значение остаются доступны для проверки.')+`<div class="grid">${card('Последние события',table(['Время','Объект','Действие','Автор'],[['14.10 15:10','Заказ WM-104','Привязка накладной','Администратор'],['14.10 14:32','Выплата 122','Подтверждение','Бухгалтер'],['14.10 11:22','Заказ WM-104','Создание','Сотрудник']]),12)}</div>`;
case'settings':return intro('Настройки','Магазин, отображение и методики разделены по разделам.')+`<div class="grid">${card('Магазин',`${pair('Название','Way Market')}${pair('Часовой пояс','Грозный · МСК')}${pair('Валюта','Российский рубль')}`,6)}${card('Данные и правила',listRow('ƒ','Сверка кассы','Версии пользовательских правил','', 'formula')+listRow('◎','Лимиты','Период и перенос','', 'limits')+listRow('⤓','Резервные копии','Проверка восстановления','', 'backup'),6)}</div>`;
case'backup':return intro('Резервные копии','Копия данных приложения не заменяет резервную копию 1С.')+`<div class="grid">${card('Состояние',`${pair('Последняя копия','Нет данных')}${pair('Проверка восстановления','Не проводилась')}${pair('Место хранения','Не настроено')}<div class="form-actions"><button class="btn primary" data-demo="Создание копии в макете отключено">Создать копию</button></div>`,7)}${card('Перед рабочим запуском','<p class="hint">Нужно проверить создание и восстановление на тестовой базе, защиту копии и порядок действий при сбое компьютера.</p>',5)}</div>`;
default:return ''}}
function permitted(){return S.filter(s=>s.roles.includes(role))}
function selectRole(next){role=next;$('role').value=role;$('mobileRole').value=role;screen=({buyer:'buyerHome',employee:'staffCatalog',rep:'repHome',accountant:'overview',owner:'overview'})[role];category='Все';location.hash=role+'/'+screen;$('drawer').hidden=true;render()}
function go(id){let s=S.find(x=>x.id===id);if(!s||!s.roles.includes(role))return;screen=id;location.hash=role+'/'+screen;render();window.scrollTo(0,0);$('drawer').hidden=true}
function navigation(){let grouped={};for(let s of permitted())(grouped[s.group]??=[]).push(s);let html=Object.entries(grouped).map(([g,items])=>`<div class="group-label">${g}</div>${items.map(s=>`<button type="button" class="side-link ${s.id===screen?'active':''}" data-go="${s.id}" ${s.id===screen?'aria-current="page"':''}><span class="icon">${s.icon}</span>${s.title}</button>`).join('')}`).join('');$('side').innerHTML=html;$('drawerNav').innerHTML=html;let tabs=role==='buyer'?['buyerHome','buyerCatalog','buyerList','buyerSaved']:role==='rep'?['repHome','repDocs','repPayments','repIssue']:role==='employee'?['staffCatalog','orders','invoices','limitView']:['overview','cash','analytics','import'];$('mobileNav').innerHTML=tabs.map(id=>{let s=S.find(x=>x.id===id);return `<button type="button" data-go="${id}" class="${screen===id?'active':''}"><span class="nav-ic">${s.icon}</span>${s.title.split(' ')[0]}</button>`}).join('')+'<button type="button" data-menu="1"><span class="nav-ic">☰</span>Ещё</button>'}
function render(){let s=S.find(x=>x.id===screen);if(!s||!s.roles.includes(role)){screen=permitted()[0].id;s=S.find(x=>x.id===screen)}navigation();$('crumb').textContent='Way Market / '+s.title;$('content').innerHTML=(role==='buyer'?buyer():role==='rep'?rep():s.group==='Магазин'?employee():finance());$('role').value=role;$('mobileRole').value=role;document.title=s.title+' — Way Market · макет'}
let timer;function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,3000)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-go],[data-category],[data-add],[data-clear],[data-demo],[data-menu]');if(!b)return;if(b.dataset.go){go(b.dataset.go)}else if(b.dataset.category){category=b.dataset.category;render()}else if(b.dataset.add){list[b.dataset.add]=(list[b.dataset.add]||0)+1;toast('Добавлено в список · демонстрация')}else if(b.dataset.clear){list={};render();toast('Список очищен')}else if(b.dataset.demo){toast(b.dataset.demo+' · действие показано только в макете')}else if(b.dataset.menu){$('drawer').hidden=false}});
document.addEventListener('input',e=>{if(e.target.id==='productSearch'){let q=e.target.value.trim().toLocaleLowerCase('ru');for(let row of document.querySelectorAll('#goodRows .item'))row.hidden=!row.dataset.name.includes(q)}});
$('role').addEventListener('change',e=>selectRole(e.target.value));$('mobileRole').addEventListener('change',e=>selectRole(e.target.value));$('theme').addEventListener('click',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'});$('device').addEventListener('click',()=>document.body.classList.toggle('preview-mobile'));$('menu').addEventListener('click',()=>$('drawer').hidden=false);$('closeDrawer').addEventListener('click',()=>$('drawer').hidden=true);$('drawer').addEventListener('click',e=>{if(e.target===$('drawer'))$('drawer').hidden=true});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('drawer').hidden=true});
const route=location.hash.slice(1).split('/');if(['buyer','employee','rep','accountant','owner'].includes(route[0])){role=route[0];if(S.some(s=>s.id===route[1]&&s.roles.includes(role)))screen=route[1]}else{role='buyer';screen='buyerHome'}render();
</script>
