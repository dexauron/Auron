const card=(title,content,span=6,hint='')=>`<section class="card span-${span}"><h2>${title}</h2>${hint?`<p class="hint">${hint}</p>`:''}${content}</section>`;
const metric=(title,value,meta,span=3)=>card(title,`<div class="metric">${value}</div><div class="meta">${meta}</div>`,span);
const tag=(s,t='')=>`<span class="tag ${t}">${s}</span>`;
const listRow=(icon,title,note,right='',target='')=>`<div class="item"><div class="avatar" aria-hidden="true">${icon}</div><div class="item-main"><div class="item-title">${title}</div><div class="item-note">${note}</div></div><div class="item-side">${right}${target?`<div style="margin-top:7px">${btn('Открыть',target)}</div>`:''}</div></div>`;

const form=(fields,actions='Сохранить черновик')=>`<div class="form-grid">${fields.join('')}</div><div class="form-actions"><button class="btn primary" type="button" data-demo="${actions}">${actions}</button><button class="btn" type="button" data-demo="Проверка данных">Проверить данные</button></div>`;
const note=(t,type='')=>`<div class="banner ${type}">${t}</div>`;
const spark=()=>`<div class="spark" aria-label="Иллюстративный график">${[38,49,44,57,53,72,65,81,76,67,93,84].map(n=>`<span style="height:${n}%"></span>`).join('')}</div>`;
function buyerGoods(){let filtered=goods.filter(g=>category==='Все'||g[2]===category);return `<div class="pills">${['Все','Молочные','Хлеб','Овощи и фрукты','Бакалея','Напитки'].map(c=>`<button type="button" class="pill ${category===c?'active':''}" data-category="${c}">${c}</button>`).join('')}</div><div class="grid">${card('Найти товар',`<input class="search" id="productSearch" type="search" placeholder="Название товара…" aria-label="Найти товар" style="width:100%"><div class="meta">Каталог демонстрационный · дата обновления не определена</div>`,12)}<div class="span-12 card"><div class="list" id="goodRows">${filtered.map(g=>goodRow(g)).join('')}</div></div></div>`}

const actionRow=(icon,title,subtitle,target)=>`<button type="button" class="action-row" data-go="${target}"><span class="action-icon" aria-hidden="true">${icon}</span><span>${title}<small>${subtitle}</small></span><span class="chev" aria-hidden="true">›</span></button>`;

function buyerHomeV2(){let count=Object.values(list).reduce((a,b)=>a+b,0);return `<h1 class="home-title">Покупки проще</h1><p class="home-sub">Товары магазина — под рукой. Составьте список или отправьте его сотруднику.</p><div class="home-hero"><div><span class="kicker">Ваш список</span><strong>${count?count+' товара':'Пока пусто'}</strong></div>${btn('Открыть список','buyerList')}</div><div class="home-actions">${actionRow('⌕','Найти товар','По названию и категории','buyerCatalog')}${actionRow('▦','Категории','Перейти к нужному отделу','buyerCategories')}${actionRow('↗','Отправить в WhatsApp','Обсудить наличие и получение','buyerShare')}</div>${disclosure('Часто покупают',goods.slice(0,3).map(g=>goodRow(g)).join('')+btn('Весь каталог','buyerCatalog'),false,'Показать')}${disclosure('Ещё для покупок',`<div class="home-actions">${actionRow('♡','Избранное','Быстрый доступ к сохранённому','buyerSaved')}${actionRow('✧','Новинки','Опубликованные магазином товары','buyerUpdates')}${actionRow('?','Помощь','Как пользоваться списком','buyerHelp')}</div>`,false,'3 раздела')}<p class="quiet-note">Демонстрационные товары и цены. Итог и наличие подтвердит сотрудник.</p>`}

// Изолированный демонстрационный расчёт. Пустое/некорректное число не равно нулю.
const cashDemo={date:'2026-10-14',shift:'1',cashier:'Кассир 1',zCash:'30000',zCard:'40000',zSbp:'20000',opening:'2500',otherIn:'0',retained:'0',claimed:'24900',accepted:'24800',payments:[{name:'Накладная № 448',amount:'7500',confirmed:true}]};
const escaped=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rubKopecks(v){let s=String(v).replace(/[\s\u00a0\u202f]/g,'');if(!/^\d+(?:[.,]\d{1,2})?$/.test(s))return null;let [a,b='']=s.replace(',','.').split('.');let n=Number(a)*100+Number((b+'00').slice(0,2));return Number.isSafeInteger(n)?n:null}
function signedMoney(k){return k===null?'Нет данных':(k>0?'+':k<0?'−':'')+fmt(Math.abs(k)/100)}
function cashFigures(){let names=['zCash','opening','otherIn','retained','claimed','accepted'],v={};for(let name of names){v[name]=rubKopecks(cashDemo[name]);if(v[name]===null)return null}let payout=0;for(let p of cashDemo.payments.filter(p=>p.confirmed)){let n=rubKopecks(p.amount);if(n===null)return null;payout+=n}let expected=v.opening+v.zCash+v.otherIn-payout-v.retained;if(!Number.isSafeInteger(expected)||expected<0)return null;return {expected,payout,declaredDiff:v.claimed-expected,handedDiff:v.accepted-v.claimed,actualDiff:v.accepted-expected}}
function moneyInput(label,key){return `<div class="control"><label>${label}<input class="field" data-cash-field="${key}" inputmode="decimal" value="${escaped(cashDemo[key])}" aria-label="${label}"></label></div>`}
function payoutRows(){return cashDemo.payments.map((p,i)=>`<div class="item"><div class="item-main"><div class="control"><label>Основание выплаты<input class="field" data-payout-name="${i}" value="${escaped(p.name)}" placeholder="Например, накладная №…"></label></div><div class="control" style="margin-top:9px"><label>Сумма из кассы, ₽<input class="field" data-payout-amount="${i}" inputmode="decimal" value="${escaped(p.amount)}" aria-label="Сумма выплаты ${i+1}"></label></div><label class="label" style="display:block;margin-top:9px"><input type="checkbox" data-payout-confirmed="${i}" ${p.confirmed?'checked':''}> Выплата подтверждена документом</label></div><button class="btn danger" data-payout-remove="${i}" aria-label="Убрать выплату ${i+1}">×</button></div>`).join('')||'<div class="empty"><b>Выплат не было</b>Подтвердите ноль выплат или добавьте документ.</div>'}
function cashResults(){let v=cashFigures();if(!v)return '<div class="banner error">Проверьте суммы: пустое поле, некорректное число или выплата больше наличных.</div>';return `${pair('Подтверждённые выплаты','−'+fmt(v.payout/100))}${pair('Кассир заявил − ожидается',signedMoney(v.declaredDiff))}${pair('Принято − заявлено',signedMoney(v.handedDiff))}${pair('Принято − ожидается',signedMoney(v.actualDiff))}<p class="meta">Минус означает недостачу, плюс — излишек.</p>`}
function shiftWorkspace(){let v=cashFigures();return `<h1 class="home-title">Закрытие смены</h1><p class="home-sub">Сначала отчёт и выплаты. Затем сумма, которую бухгалтер получил и пересчитал.</p><div class="home-hero"><div><span class="kicker">Ожидается к передаче · пример</span><strong id="cashExpectedInline">${v?fmt(v.expected/100):'Нет данных'}</strong></div>${btn('Проверить расхождения','reconcile')}</div>${disclosure('1. Данные Z‑отчёта',`<div class="form-grid"><div class="control"><label>Дата смены<input class="field" type="date" data-cash-field="date" value="${cashDemo.date}"></label></div><div class="control"><label>Номер смены<input class="field" data-cash-field="shift" value="${escaped(cashDemo.shift)}"></label></div><div class="control wide"><label>Кассир<input class="field" data-cash-field="cashier" value="${escaped(cashDemo.cashier)}"></label></div>${moneyInput('Наличные по Z‑отчёту, ₽','zCash')}${moneyInput('Карта по Z‑отчёту, ₽','zCard')}${moneyInput('СБП по Z‑отчёту, ₽','zSbp')}</div><p class="meta">Карта и СБП хранятся отдельно от переданных наличных.</p>`,true)}${disclosure('2. Выплаты из кассы',`${payoutRows()}<div class="form-actions"><button class="btn" data-payout-add="1">+ Добавить выплату</button></div><p class="meta">В расчёт входят подтверждённые выплаты из этой смены. Если выплат не было, оставьте список пустым.</p>`,false,`<span id="payoutTotalInline">${v?fmt(v.payout/100):'Проверить'}</span>`).replace('<details class="disclosure"','<details class="disclosure" data-step="payout"')}${disclosure('3. Передача бухгалтеру',`<div class="form-grid">${moneyInput('Наличные на начало смены, ₽','opening')}${moneyInput('Другой подтверждённый приход, ₽','otherIn')}${moneyInput('Размен оставили в кассе, ₽','retained')}${moneyInput('Кассир заявил, что передал, ₽','claimed')}${moneyInput('Бухгалтер принял и пересчитал, ₽','accepted')}</div>`,false)}${disclosure('Подробный расчёт',`<div id="cashResults">${cashResults()}</div><div class="form-actions">${btn('Отдельный экран сверки','reconcile')}</div>`,false)}<div class="form-actions"><button class="btn primary" data-demo="Черновик смены">Сохранить черновик</button></div><p class="quiet-note">Демонстрация: значения живут только в открытом макете и не проводятся в учёте.</p>`}
function reconcileWorkspace(){let v=cashFigures(),moneyOf=s=>{let n=rubKopecks(s);return n===null?'Нет данных':fmt(n/100)};return `<h1 class="home-title">Сверка кассы</h1><p class="home-sub">Итог после независимого пересчёта бухгалтером.</p><div class="home-hero ${v&&v.actualDiff<0?'danger':''}"><div><span class="kicker">${v?v.actualDiff<0?'Недостача':v.actualDiff>0?'Излишек':'Без расхождения':'Нужны данные'}</span><strong id="cashExpectedInline">${v?signedMoney(v.actualDiff):'Нет данных'}</strong><span class="kicker">Принято − расчётно к передаче</span></div>${btn('Изменить суммы','shift')}</div><div class="card">${pair('Расчётно к передаче',v?fmt(v.expected/100):'Нет данных')}${pair('Кассир заявил',moneyOf(cashDemo.claimed))}${pair('Бухгалтер пересчитал',moneyOf(cashDemo.accepted))}</div>${disclosure('Откуда получилась разница',`<div id="cashResults">${cashResults()}</div><p class="meta">Каждое значение можно проследить до Z‑отчёта, выплат и передачи.</p>${btn('Показать исходные поля','shift')}`,false)}${disclosure('Карта и СБП',`${pair('Карта по Z‑отчёту',moneyOf(cashDemo.zCard))}${pair('СБП по Z‑отчёту',moneyOf(cashDemo.zSbp))}<p class="meta">Сверка с эквайрингом/банком проводится отдельно. Эти суммы не включены в наличные, переданные бухгалтеру.</p>`,false)}${disclosure('Правило расчёта',`${pair('Начало + наличная выручка + прочий приход','')}${pair('Минус выплаты и оставленный размен','')}${btn('Настроить формулу','formula')}`,false)}<p class="quiet-note">Все числа вымышленные и не сохраняются.</p>`}

case'suppliers':return intro('Поставщики','Связь с 1С строится по устойчивому коду и подтверждённым соответствиям.')+`<div class="grid">${card('Справочник',table(['Поставщик','Код источника','Документы','Сверка'],[['Молочный двор','SUP-001','14',tag('Сопоставлено','good')],['Юг Фуд','SUP-002','9',tag('Сопоставлено','good')],['Неизвестный контрагент','—','1',tag('Требует выбора','warn')]]),12)}</div>`;
case'roles':return intro('Доступ сотрудников','Назначение прав — отдельное действие владельца. Этот экран не даёт реального доступа.',btn('Добавить приглашение','roles','primary'))+`<div class="grid">${card('Участники',table(['Сотрудник','Роль','Область','Статус'],[['А. Исаев','Администратор','Магазин',tag('Активен','good')],['М. Алиева','Бухгалтер','Финансы',tag('Активен','good')],['Т. Хаджиев','Сотрудник','Каталог и заказы',tag('Активен','good')]]),12)}${card('Права',`<p class="hint">Матрица утверждается отдельно. Роль и магазин проверяются в каждой операции, а не только в интерфейсе. В локальном режиме на одном ПК разделение доступа требует отдельной защиты хранилища.</p>`,12)}</div>`;
case'audit':return intro('Журнал изменений','Автор, время и прежнее значение остаются доступны для проверки.')+`<div class="grid">${card('Последние события',table(['Время','Объект','Действие','Автор'],[['14.10 15:10','Заказ WM-104','Привязка накладной','Администратор'],['14.10 14:32','Выплата 122','Подтверждение','Бухгалтер'],['14.10 11:22','Заказ WM-104','Создание','Сотрудник']]),12)}</div>`;
case'settings':return intro('Настройки','Магазин, отображение и методики разделены по разделам.')+`<div class="grid">${card('Магазин',`${pair('Название','Way Market')}${pair('Часовой пояс','Грозный · МСК')}${pair('Валюта','Российский рубль')}`,6)}${card('Данные и правила',listRow('ƒ','Сверка кассы','Версии пользовательских правил','', 'formula')+listRow('◎','Лимиты','Период и перенос','', 'limits')+listRow('⤓','Резервные копии','Проверка восстановления','', 'backup'),6)}</div>`;
case'backup':return intro('Резервные копии','Копия данных приложения не заменяет резервную копию 1С.')+`<div class="grid">${card('Состояние',`${pair('Последняя копия','Нет данных')}${pair('Проверка восстановления','Не проводилась')}${pair('Место хранения','Не настроено')}<div class="form-actions"><button class="btn primary" data-demo="Создание копии в макете отключено">Создать копию</button></div>`,7)}${card('Перед рабочим запуском','<p class="hint">Нужно проверить создание и восстановление на тестовой базе, защиту копии и порядок действий при сбое компьютера.</p>',5)}</div>`;
default:return extendedScreen()}}

// Предметные карточки экранов для обсуждения: поля и состояние зависят от сценария.
function extendedScreen(){let s=S.find(x=>x.id===screen);if(!s||!s.kind)return '';
 let status=tag(s.status,s.status==='Доступно'?'good':'warn');
 let rows=s.fields.map(f=>pair(f,'— · пример или нет данных')).join('');
 let content=s.kind==='kpi'?`${note('Для расчёта нужны: '+s.needed+'. Если выгрузка неполна, выводится «Нет данных», а не ноль.','warning')}${card('Паспорт показателя',`${pair('Что требуется',s.needed)}${pair('Период','Один период для числителя и знаменателя')}${pair('Состояние','Методика к реализации')}`,8)}${card('Проверить доступность',`${btn('Недостающие данные','readiness')}<p class="hint">Точная формула и учётная политика утверждаются в ТЗ до подключения данных.</p>`,4)}`:
 s.kind==='task'?`${card('Данные для действия',s.fields.map(f=>control(f,'Введите или выберите…')).join('')+`<div class="form-actions"><button class="btn primary" type="button" data-demo="Черновик: сохранение не подключено">Продолжить</button></div>`,8)}${card('Порядок',`<p class="hint">${s.summary}</p>${pair('Статус',status)}`,4)}`:
 s.kind==='history'?`${card('История',table(['Поле','Значение'],s.fields.map(f=>[f,'Нет данных · макет'])),12)}`:
 s.kind==='exception'?`${note(s.summary,'warning')}${card('Проверить причину',rows,8)}${card('Следующий шаг',btn('Вернуться',s.related),4)}`:
 s.kind==='review'?`${card('Проверка перед решением',rows,8)}${card('Следующий шаг',`<p class="hint">Подтверждение требует прав и журнала событий. Здесь действие не выполняется.</p>${btn('Исходный раздел',s.related)}`,4)}`:
 `${card('Сведения',rows,8)}${card('Связанный раздел',`<p class="hint">${s.summary}</p>${btn('Открыть',s.related)}`,4)}`;
 return intro(s.title,s.summary,btn('К разделу',s.related))+`<div class="grid">${content}</div><p class="meta">Экран сценария · ${s.kind==='kpi'?'аналитика':s.kind} · прототип без сохранения данных</p>`}
function permitted(){return S.filter(s=>s.roles.includes(role))}
function selectRole(next){role=next;$('role').value=role;$('mobileRole').value=role;screen=({buyer:'buyerHome',employee:'staffCatalog',rep:'repHome',accountant:'overview',owner:'overview'})[role];category='Все';location.hash=role+'/'+screen;$('drawer').hidden=true;render()}
function go(id){let s=S.find(x=>x.id===id);if(!s||!s.roles.includes(role))return;screen=id;location.hash=role+'/'+screen;render();window.scrollTo(0,0);$('drawer').hidden=true}
function navIcon(id){let paths={buyerHome:'M3 10 12 3l9 7v10H3z M9 20v-6h6v6',buyerCatalog:'M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z',buyerList:'M4 6l2 2 3-3 M12 7h8 M4 15l2 2 3-3 M12 16h8',buyerSaved:'M20 9c0 5-8 10-8 10S4 14 4 9a4 4 0 0 1 8-1 4 4 0 0 1 8 1',staffCatalog:'M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z',orders:'M5 4h14v16H5z M8 8h8 M8 12h8 M8 16h5',invoices:'M5 3h14v18l-3-2-4 2-4-2-3 2z M8 8h8 M8 12h8',limitView:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18 M12 7v5l3 2',repHome:'M3 10 12 3l9 7v10H3z',repDocs:'M5 4h14v16H5z M8 9h8 M8 13h8',repPayments:'M4 12h16 M7 7h10 M7 17h10',repIssue:'M12 3l9 17H3z M12 9v5 M12 17h.01',overview:'M3 10 12 3l9 7v10H3z M9 20v-6h6v6',shift:'M5 3h14v18l-3-2-4 2-4-2-3 2z M8 8h8 M8 12h8',reconcile:'M3 7h18 M6 7l-3 8h6z M18 7l-3 8h6z M8 20h8 M12 7v13',cash:'M3 6h18v12H3z M16 12h2 M6 10h5'};return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[id]||'M4 5h16v14H4z M8 10h8 M8 14h8'}"/></svg>`}
function navigation(){let grouped={};for(let s of permitted())(grouped[s.group]??=[]).push(s);const link=s=>`<button type="button" class="side-link ${s.id===screen?'active':''}" data-go="${s.id}" ${s.id===screen?'aria-current="page"':''}><span class="icon">${s.icon}</span>${s.title}</button>`;$('side').innerHTML=Object.entries(grouped).map(([g,items])=>`<div class="group-label">${g}</div>${items.map(link).join('')}`).join('');$('drawerNav').innerHTML=`<div class="control" style="padding:0 8px 11px"><label>Найти экран<input type="search" class="search" data-nav-search="1" placeholder="Например, выплаты" aria-label="Найти экран" style="width:100%"></label></div>`+Object.entries(grouped).map(([g,items])=>`<details class="nav-section" ${items.some(x=>x.id===screen)?'open':''}><summary>${g}<span class="nav-count">${items.length}</span></summary>${items.map(link).join('')}</details>`).join('');let tabs=role==='buyer'?['buyerHome','buyerCatalog','buyerList','buyerSaved']:role==='rep'?['repHome','repDocs','repPayments','repIssue']:role==='employee'?['staffCatalog','orders','invoices','limitView']:['overview','shift','reconcile','cash'];let label={buyerHome:'Главная',buyerCatalog:'Каталог',buyerList:'Список',buyerSaved:'Избранное',staffCatalog:'Каталог',orders:'Заказы',invoices:'Документы',limitView:'Лимит',repHome:'Главная',repDocs:'Документы',repPayments:'Выплаты',repIssue:'Сверка',overview:'Сегодня',shift:'Смена',reconcile:'Сверка',cash:'Счета'};$('mobileNav').innerHTML=tabs.map(id=>`<button type="button" data-go="${id}" class="${screen===id?'active':''}" ${screen===id?'aria-current="page"':''}><span class="nav-ic">${navIcon(id)}</span>${label[id]}</button>`).join('')+'<button type="button" data-menu="1"><span class="nav-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16 M4 12h16 M4 18h16"/></svg></span>Ещё</button>'}
function render(){let s=S.find(x=>x.id===screen);if(!s||!s.roles.includes(role)){screen=permitted()[0].id;s=S.find(x=>x.id===screen)}navigation();$('crumb').textContent='WAY MARKET';$('content').innerHTML=(role==='buyer'?buyer():role==='rep'?rep():s.group==='Магазин'?employee():finance());$('role').value=role;$('mobileRole').value=role;document.title=s.title+' — Way Market · макет'}
let timer;function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,3000)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-go],[data-category],[data-add],[data-clear],[data-demo],[data-menu],[data-payout-add],[data-payout-remove]');if(!b)return;if(b.dataset.go){go(b.dataset.go)}else if(b.dataset.category){category=b.dataset.category;render()}else if(b.dataset.add){list[b.dataset.add]=(list[b.dataset.add]||0)+1;toast('Добавлено в список · демонстрация')}else if(b.dataset.clear){list={};render();toast('Список очищен')}else if(b.dataset.payoutAdd){cashDemo.payments.push({name:'',amount:'',confirmed:false});render();document.querySelector('[data-step=payout]')?.setAttribute('open','')}else if(b.dataset.payoutRemove!==undefined){cashDemo.payments.splice(Number(b.dataset.payoutRemove),1);render();document.querySelector('[data-step=payout]')?.setAttribute('open','')}else if(b.dataset.demo){toast(b.dataset.demo+' · действие показано только в макете')}else if(b.dataset.menu){$('drawer').hidden=false}});
function refreshCash(){let box=$('cashResults'),v=cashFigures();if(box)box.innerHTML=cashResults();let expected=$('cashExpectedInline');if(expected&&screen==='shift')expected.textContent=v?fmt(v.expected/100):'Нет данных';let payout=$('payoutTotalInline');if(payout)payout.textContent=v?fmt(v.payout/100):'Проверить'}
document.addEventListener('input',e=>{if(e.target.id==='productSearch'){let q=e.target.value.trim().toLocaleLowerCase('ru');for(let row of document.querySelectorAll('#goodRows .item'))row.hidden=!row.dataset.name.includes(q)}if(e.target.dataset.navSearch!==undefined){let q=e.target.value.trim().toLocaleLowerCase('ru');for(let group of document.querySelectorAll('.nav-section')){let any=false;for(let link of group.querySelectorAll('.side-link')){link.hidden=!link.textContent.toLocaleLowerCase('ru').includes(q);if(!link.hidden)any=true}group.hidden=!any;if(q&&any)group.open=true}}if(e.target.dataset.cashField){cashDemo[e.target.dataset.cashField]=e.target.value;refreshCash()}if(e.target.dataset.payoutAmount!==undefined){cashDemo.payments[Number(e.target.dataset.payoutAmount)].amount=e.target.value;refreshCash()}if(e.target.dataset.payoutName!==undefined){cashDemo.payments[Number(e.target.dataset.payoutName)].name=e.target.value}});
document.addEventListener('change',e=>{if(e.target.dataset.payoutConfirmed!==undefined){cashDemo.payments[Number(e.target.dataset.payoutConfirmed)].confirmed=e.target.checked;refreshCash()}});
$('role').addEventListener('change',e=>selectRole(e.target.value));$('mobileRole').addEventListener('change',e=>selectRole(e.target.value));$('theme').addEventListener('click',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'});$('device').addEventListener('click',()=>document.body.classList.toggle('preview-mobile'));$('menu').addEventListener('click',()=>$('drawer').hidden=false);$('closeDrawer').addEventListener('click',()=>$('drawer').hidden=true);$('drawer').addEventListener('click',e=>{if(e.target===$('drawer'))$('drawer').hidden=true});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('drawer').hidden=true});
const route=location.hash.slice(1).split('/');if(['buyer','employee','rep','accountant','owner'].includes(route[0])){role=route[0];if(S.some(s=>s.id===route[1]&&s.roles.includes(role)))screen=route[1]}else{role='buyer';screen='buyerHome'}render();
</script>
