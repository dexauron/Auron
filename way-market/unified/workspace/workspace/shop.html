<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Way Market · Каталог покупателя</title><link rel="stylesheet" href="/workspace.css"><script type="module" src="/shop.mjs"></script></head><body><main class="shop-main"><h1>Way Market</h1><p>Каталог покупателя</p><p class="fine">Цены и наличие требуют подтверждения в магазине. Список не создаёт заказ или платёж.</p><label>Поиск товара<input id="search" type="search" maxlength="300" placeholder="Молоко 0,9 л до 100 рублей"></label><p id="status" role="status"></p><section class="surface"><h2>Товары</h2><div id="products"></div></section><section class="surface"><h2>Мой список</h2><div id="list"></div><p id="total"></p><button id="copy" class="primary" type="button">Скопировать список</button><p class="fine">Список хранится в памяти этой страницы. После перезагрузки его нужно составить заново.</p></section></main></body></html>
